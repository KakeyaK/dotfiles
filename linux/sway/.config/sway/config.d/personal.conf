# Workspaces:
set $ws0 0
set $ws1 1
set $ws2 2
set $ws3 3
set $ws4 4
set $ws5 5
set $ws6 6

# Workrooms:
set $workroom 0
set $workspace 1

# Workroom switching - updates current workroom and switches to workspace 1 in that workroom
$bindsym ctrl+$mod+1 set $$workroom 0; workspace number $ws1; set $$workspace $ws1
$bindsym ctrl+$mod+2 set $$workroom 1; workspace number 1$$workspace; set $workspace $ws1  
$bindsym ctrl+$mod+3 set $$workroom 2; workspace number 2$$workspace; set $workspace $ws1

# Navigate within current workroom
$unbindsym $mod+1
$unbindsym $mod+2
$unbindsym $mod+3
$unbindsym $mod+4
$unbindsym $mod+5
$unbindsym $mod+6

# For workroom 0: use plain numbers (1,2,3,etc)
# For workroom 1+: use concatenation (11,12,13,etc or 21,22,23,etc)
$bindsym $mod+1 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws1; else swaymsg workspace number $$workroom$ws1; fi'; set $$workspace $ws1
$bindsym $mod+2 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws2; else swaymsg workspace number $$workroom$ws2; fi'; set $$workspace $ws2
$bindsym $mod+3 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws3; else swaymsg workspace number $$workroom$ws3; fi'; set $$workspace $ws3
$bindsym $mod+4 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws4; else swaymsg workspace number $$workroom$ws4; fi'; set $$workspace $ws4
$bindsym $mod+5 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws5; else swaymsg workspace number $$workroom$ws5; fi'; set $$workspace $ws5
$bindsym $mod+6 exec 'if [ $$workroom -eq 0 ]; then swaymsg workspace number $ws6; else swaymsg workspace number $$workroom$ws6; fi'; set $$workspace $ws6

# Move focused window to workspace  
$unbindsym $mod+Shift+1
$unbindsym $mod+Shift+2
$unbindsym $mod+Shift+3
$unbindsym $mod+Shift+4
$unbindsym $mod+Shift+5
$unbindsym $mod+Shift+6

$bindsym $mod+Shift+1 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws1; else swaymsg move container to workspace number $$workroom$ws1; fi'
$bindsym $mod+Shift+2 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws2; else swaymsg move container to workspace number $$workroom$ws2; fi'
$bindsym $mod+Shift+3 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws3; else swaymsg move container to workspace number $$workroom$ws3; fi'
$bindsym $mod+Shift+4 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws4; else swaymsg move container to workspace number $$workroom$ws4; fi'
$bindsym $mod+Shift+5 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws5; else swaymsg move container to workspace number $$workroom$ws5; fi'
$bindsym $mod+Shift+6 exec 'if [ $$workroom -eq 0 ]; then swaymsg move container to workspace number $ws6; else swaymsg move container to workspace number $$workroom$ws6; fi'

input * {
    # toggles through configured layouts via win_space 
    # query the available layout toggles: `localectl list-x11-keymap-options | grep grp:`
    # xkb_options grp:win_space_toggle
    
    # query the available layouts: `localectl list-x11-keymap-layouts`
    xkb_layout "br"
    
    # query the available variants for a given layout: `localectl list-x11-keymap-variants de`
    # list in the same order as the layouts - empty equals the default layout
    xkb_variant ""
}

# Middle mouse button scroll 
input * {
    scroll_method on_button_down
    scroll_button BTN_MIDDLE
    scroll_factor 0.7
}

# Type special keys on en keyboard using abnt layout
$bindsym Mod5+0 exec wtype "|"

# Screenshot shortcut 
$unbindsym $mod+Shift+s
$bindsym $mod+Shift+s mode $mode_screenshot

# calculator
$bindsym $mod+c exec $calc

# Multi-display workspace assignments
workspace 10 output eDP-1
workspace 9 output DP-4

# Monitor
# Map touchscreen to specific output
input "1118:2463:IPTS_045E:099F_Touchscreen" {
    map_to_output eDP-1
}

# Shikane
exec_always shikane

### Application workspace assignments

# Messaging apps to workspace 8
assign [app_id="^brave.*" title=".*WhatsApp.*"] workspace 8
assign [app_id="^brave.*" title=".*Telegram.*"] workspace 8
assign [class="discord"] workspace 8
assign [class="Discord"] workspace 8
assign [app_id="org.telegram.desktop"] workspace 8
assign [class="TelegramDesktop"] workspace 8

# Music apps to workspace 7  
assign [app_id="^brave.*" title=".*YouTube.*"] workspace 7 # matches both youtube and youtube music
assign [class="Spotify"] workspace 7
assign [app_id="com.spotify.Client"] workspace 7

