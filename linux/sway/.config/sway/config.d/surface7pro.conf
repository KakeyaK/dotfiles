# Map touchscreen to specific output
# Verify the input identifier:
#   swaymsg -t get_inputs | jq '.[] | {identifier, name}'
# Verify the output name:
#   swaymsg -t get_outputs | jq '.[] | {name, description}'
# input "1118:2463:IPTS_045E:099F_Touchscreen" {
#     map_to_output eDP-1
# }

# Alternatively, map all touch devices to the internal display:
input "type:touch" {
    map_to_output eDP-1
}