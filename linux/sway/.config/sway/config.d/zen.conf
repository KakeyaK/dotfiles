# Map touchscreen to specific output
input "1118:2463:IPTS_045E:099F_Touchscreen" {
    map_to_output eDP-1
}

# Shikane make displays position correctly.
# Once for each display, we need to set the positions
# For that, we position the displays using the wdisplays 
# and then run shikanectl export "<name>", append the result
# to .config/shikane/config.toml 
exec_always shikane

