# Application launcher
set $menu rofi -show drun -modi "drun,calc,run,ssh" -terminal "$term" -ssh-command "{terminal} {ssh-client} {host} [-p {port}]" -run-shell-command "{terminal} {cmd}" -show-icons -font "$gui-font" -lines 10 -calc-command "echo '{result}' | wl-copy"

set $calc rofi -show calc -modi calc -no-show-match -no-sort -show-icons -font "$gui-font" -lines 10 -calc-command "echo '{result}' | wl-copy"

# Do not change the focus of the window according to the mouse position, only with the click.
focus_follows_mouse no

# Workspace names
# set $ws_x xuxa
# set $ws_z zuxa

